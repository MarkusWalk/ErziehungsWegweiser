name: Seite bauen und veröffentlichen

# Liefert docs/ an GitHub Pages aus.
#
# EINMALIG NOETIG: Pages muss in den Repo-Einstellungen aktiviert sein.
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# Der Versuch, das hier per configure-pages(enablement) zu erledigen, endet
# mit "Resource not accessible by integration": der GITHUB_TOKEN darf eine
# Pages-Site nicht anlegen, nur eine bestehende bespielen.
#
# Ausserdem: Bei einem privaten Repository setzt Pages einen bezahlten Plan
# voraus (Pro, Team oder Enterprise). Auf einem kostenlosen Konto muss das
# Repository oeffentlich sein, damit Pages ueberhaupt zur Verfuegung steht.
#
# Bewusst kein Build auf der Seite von GitHub: docs/ enthält fertiges
# HTML/CSS/JS. Der Job prüft stattdessen, ob docs/ zum aktuellen Inhalt passt,
# und bricht ab, wenn jemand content/ geändert, aber nicht neu gebaut hat.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pruefen:
    name: Inhalte prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Artikel gegen die Autorenregeln prüfen
        run: node build/lint.mjs

      - name: docs/ auf Aktualität prüfen
        run: |
          node build/build.mjs --quiet
          if ! git diff --quiet -- docs; then
            echo "::error::docs/ ist nicht auf dem Stand von content/ und site/."
            echo "Bitte 'node build/build.mjs' ausführen und das Ergebnis mitcommitten."
            git diff --stat -- docs
            exit 1
          fi
          echo "docs/ entspricht dem aktuellen Stand."

  veroeffentlichen:
    name: Veröffentlichen
    needs: pruefen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Pages einrichten
        uses: actions/configure-pages@v5
        with:
          # Legt die Pages-Site an, falls sie noch nicht existiert. Bei einem
          # privaten Repository scheitert das mit "Resource not accessible by
          # integration", weil Pages dort einen bezahlten Plan voraussetzt.
          # Oeffentliches Repository: der Schritt richtet Pages selbst ein.
          enablement: true

      - name: docs/ hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Ausliefern
        id: deployment
        uses: actions/deploy-pages@v4

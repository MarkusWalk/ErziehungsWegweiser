<link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>body{margin:0;padding:16px;background:var(--paper-sage);font-family:var(--font-sans)}
#root{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cell{position:relative;display:grid;place-items:center;height:210px}
.cap{position:absolute;left:4px;top:2px;font-family:var(--font-mono);font-size:10px;color:var(--paper-ink-muted)}
</style>
<script>window.ITM_BOTANICAL_BASE = '../assets/botanical/';</script>
<div id="root"></div>
<script>
(async () => {
  const src = await (await fetch('../components/slide/Specimen.jsx')).text();
  const stripped = src.replace(/^import[^\n]*\n/m, '').replace(/\bexport\s+/g, '');
  const code = Babel.transform(stripped, { presets: ['react'] }).code;
  const mod = new Function('React', code + '\nreturn {GLYPHS, glyphNodes, SpecimenGlyph};')(React);
  const keys = Object.keys(mod.GLYPHS);
  const cells = keys.map(k => React.createElement('div', { className: 'cell', key: k },
    React.createElement('span', { className: 'cap' }, k + ' · ' + mod.glyphNodes(k, 14).length),
    React.createElement(mod.SpecimenGlyph, { glyph: k, size: 180, count: 14 })));
  ReactDOM.createRoot(document.getElementById('root')).render(cells);
})();
</script>

<!-- @dsCard group="Layout" viewport="760x400" name="Slide Anatomy" subtitle="1920×1080 · 140px side margins · 100px top and bottom" -->
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;box-sizing:border-box;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-primary)}
.lbl{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint)}
.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-faint)}</style>
<div style="position:relative;width:100%;aspect-ratio:16/9;background:var(--surface-page);border-radius:12px;overflow:hidden;border:1px solid var(--border-subtle)">
<div style="position:absolute;inset:0;padding:9.26% 7.29%;box-sizing:border-box"><div style="width:100%;height:100%;border:1px dashed var(--coral-300);border-radius:6px;position:relative">
<div style="position:absolute;top:0;left:0;right:0;height:14%;border-bottom:1px dashed var(--violet-300);display:flex;align-items:center;font-size:11px;color:var(--violet-600);padding-left:8px">Eyebrow + title zone</div>
<div style="position:absolute;top:14%;left:0;right:0;bottom:12%;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 8px;box-sizing:border-box">
<div style="background:var(--ink-000);border-radius:8px;box-shadow:var(--elevation-2)"></div><div style="background:var(--ink-000);border-radius:8px;box-shadow:var(--elevation-2)"></div><div style="background:var(--ink-000);border-radius:8px;box-shadow:var(--elevation-2)"></div></div>
<div style="position:absolute;bottom:0;left:0;right:0;height:12%;border-top:1px dashed var(--violet-300);display:flex;align-items:center;font-size:11px;color:var(--violet-600);padding-left:8px">Footer / page number</div>
</div></div></div>
<div style="margin-top:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;font-size:12px;color:var(--text-muted)">
<div><span class="mono">--slide-margin-x</span><br>140px side gutter</div>
<div><span class="mono">--slide-margin-y</span><br>100px top / bottom</div>
<div><span class="mono">--slide-gutter</span><br>36px between cards</div>
<div>Body content is left-aligned. Only title and section slides centre.</div></div>

<!-- @dsCard group="Effects" viewport="760x270" name="Harmonic Geometry" subtitle="CSS orbs and rings — the deck’s signature decoration" -->
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;box-sizing:border-box;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-primary)}
.lbl{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint)}
.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-faint)}</style>
<div style="display:flex;align-items:center;gap:40px;padding:14px 0">
<div style="position:relative;width:150px;height:150px;display:flex;align-items:center;justify-content:center">
<div style="position:absolute;width:150px;height:150px;border-radius:50%;border:1.5px solid var(--coral-200)"></div>
<div style="position:absolute;width:118px;height:118px;border-radius:50%;border:1.5px solid var(--coral-300)"></div>
<div style="width:88px;height:88px;border-radius:50%;background:var(--orb-coral);box-shadow:var(--glow-coral)"></div></div>
<div style="width:78px;height:78px;border-radius:50%;background:var(--orb-violet);box-shadow:var(--glow-violet)"></div>
<div style="width:62px;height:62px;border-radius:50%;background:var(--orb-sky);box-shadow:var(--glow-sky)"></div>
<div style="width:50px;height:50px;border-radius:50%;background:var(--orb-moss);box-shadow:var(--glow-moss)"></div>
<div style="flex:1;font-size:12.5px;color:var(--text-muted);line-height:1.55;max-width:34ch">Every sphere carries a glow tinted with its <em>own</em> hue at 40–45% alpha. That hue-matched lighting is the one deliberate effect in the system. Rings are hairline-only and always concentric with something.</div>
</div>

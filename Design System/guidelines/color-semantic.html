<!-- @dsCard group="Colors" viewport="760x230" name="Status Colors" subtitle="Success, warning, danger, info — with their soft fills" -->
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;box-sizing:border-box;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-primary)}
.lbl{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint)}
.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-faint)}</style>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px">
<div><div style="height:64px;border-radius:12px 12px 0 0;background:var(--status-success)"></div><div style="height:44px;border-radius:0 0 12px 12px;background:var(--status-success-soft);display:flex;align-items:center;padding:0 12px;font-size:11px;color:var(--text-muted)">soft fill</div><div style="margin-top:9px;font-size:13px;font-weight:600">Success</div><div class="mono">#2E8B5F</div></div><div><div style="height:64px;border-radius:12px 12px 0 0;background:var(--status-warning)"></div><div style="height:44px;border-radius:0 0 12px 12px;background:var(--status-warning-soft);display:flex;align-items:center;padding:0 12px;font-size:11px;color:var(--text-muted)">soft fill</div><div style="margin-top:9px;font-size:13px;font-weight:600">Warning</div><div class="mono">#D08A1E</div></div><div><div style="height:64px;border-radius:12px 12px 0 0;background:var(--status-danger)"></div><div style="height:44px;border-radius:0 0 12px 12px;background:var(--status-danger-soft);display:flex;align-items:center;padding:0 12px;font-size:11px;color:var(--text-muted)">soft fill</div><div style="margin-top:9px;font-size:13px;font-weight:600">Danger</div><div class="mono">#D6453D</div></div><div><div style="height:64px;border-radius:12px 12px 0 0;background:var(--status-info)"></div><div style="height:44px;border-radius:0 0 12px 12px;background:var(--status-info-soft);display:flex;align-items:center;padding:0 12px;font-size:11px;color:var(--text-muted)">soft fill</div><div style="margin-top:9px;font-size:13px;font-weight:600">Info</div><div class="mono">#2E8ED8</div></div>
</div><div style="margin-top:16px;font-size:12px;color:var(--text-muted);line-height:1.5">Status colours are functional only — never decorative. Coral stays reserved for the brand accent, so a coral element never means "error".</div>

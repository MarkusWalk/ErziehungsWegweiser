<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing Scale" subtitle="4px base, up to 128px" -->
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);padding:16px;box-sizing:border-box;background:#fff}
  .row{display:flex;align-items:flex-end;gap:10px;height:130px}
  .bar{background:var(--accent-secondary);width:28px}
  .lbl{font-size:11px;color:var(--text-muted);text-align:center;margin-top:4px}
  .col{display:flex;flex-direction:column;align-items:center}
</style>
<div class="row">
  <div class="col"><div class="bar" style="height:var(--space-1)"></div><div class="lbl">4</div></div>
  <div class="col"><div class="bar" style="height:var(--space-2)"></div><div class="lbl">8</div></div>
  <div class="col"><div class="bar" style="height:var(--space-3)"></div><div class="lbl">12</div></div>
  <div class="col"><div class="bar" style="height:var(--space-4)"></div><div class="lbl">16</div></div>
  <div class="col"><div class="bar" style="height:var(--space-5)"></div><div class="lbl">24</div></div>
  <div class="col"><div class="bar" style="height:var(--space-6)"></div><div class="lbl">32</div></div>
  <div class="col"><div class="bar" style="height:var(--space-7)"></div><div class="lbl">48</div></div>
  <div class="col"><div class="bar" style="height:var(--space-8);max-height:96px"></div><div class="lbl">64</div></div>
</div>

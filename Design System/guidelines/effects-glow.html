<!-- @dsCard group="Effects" viewport="700x200" name="Harmonic Highlight Glows" subtitle="Hue-matched colored shadow behind orbs/badges" -->
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);padding:24px;box-sizing:border-box;background:#fff;display:flex;gap:40px;align-items:center;justify-content:center}
.orb{width:90px;height:90px;border-radius:50%}
.lbl{font-size:11px;color:var(--text-muted);text-align:center;margin-top:14px}
.col{display:flex;flex-direction:column;align-items:center}
</style>
<div class="col"><div class="orb" style="background:var(--accent-primary);box-shadow:var(--glow-coral)"></div><div class="lbl">glow-coral</div></div>
<div class="col"><div class="orb" style="background:var(--accent-secondary);box-shadow:var(--glow-violet)"></div><div class="lbl">glow-violet</div></div>
<div class="col"><div class="orb" style="background:var(--accent-tertiary);box-shadow:var(--glow-sky)"></div><div class="lbl">glow-sky</div></div>

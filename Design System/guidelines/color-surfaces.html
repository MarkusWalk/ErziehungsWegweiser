<!-- @dsCard group="Colors" viewport="700x150" name="Semantic Surfaces" subtitle="Page canvas vs. card vs. dark" -->
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans)}
  .row{display:flex;height:150px;gap:12px;padding:12px;box-sizing:border-box;background:#fafafa}
  .sw{flex:1;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
</style>
<div class="row">
  <div class="sw" style="background:var(--surface-page);color:var(--text-primary);border:1px solid var(--border-subtle)">surface-page</div>
  <div class="sw" style="background:var(--surface-card);color:var(--text-primary);box-shadow:var(--shadow-card)">surface-card</div>
  <div class="sw" style="background:var(--surface-dark);color:#fff">surface-dark</div>
</div>

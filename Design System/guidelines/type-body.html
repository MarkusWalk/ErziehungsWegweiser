<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;box-sizing:border-box;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-primary)}
.lbl{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint)}
.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-faint)}</style>
<div style="display:grid;grid-template-columns:auto 1fr;gap:0 28px;align-items:baseline">
<span class="mono">4xl · 48</span><span style="font-family:var(--font-display);font-size:48px;font-weight:700;letter-spacing:-.025em;line-height:1.2">Page title</span>
<span class="mono">3xl · 38</span><span style="font-family:var(--font-display);font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1.3">Section heading</span>
<span class="mono">2xl · 30</span><span style="font-family:var(--font-display);font-size:30px;font-weight:600;line-height:1.3">Subsection</span>
<span class="mono">xl · 24</span><span style="font-size:24px;font-weight:600;line-height:1.4">Card title</span>
<span class="mono">md · 18</span><span style="font-size:18px;line-height:1.5">Lead paragraph</span>
<span class="mono">base · 16</span><span style="font-size:16px;line-height:1.5;color:var(--text-secondary)">Body copy — the default for everything you actually read.</span>
<span class="mono">sm · 14</span><span style="font-size:14px;color:var(--text-muted)">Secondary text, hints, table cells</span>
<span class="mono">xs · 12</span><span style="font-size:12px;color:var(--text-faint)">Captions, tag labels, footnotes</span>
</div>
